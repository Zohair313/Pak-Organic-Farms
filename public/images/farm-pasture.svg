<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#C5DCE8" />
      <stop offset="100%" stop-color="#E8ECE4" />
    </linearGradient>
    <linearGradient id="pasture" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#889868" />
      <stop offset="100%" stop-color="#55673E" />
    </linearGradient>
  </defs>
  <!-- Open morning sky -->
  <rect width="1000" height="350" fill="url(#skyGrad)" />
  <circle cx="220" cy="180" r="80" fill="#FFF8E0" opacity="0.6" />
  
  <!-- Distant Margalla hills silhouette -->
  <path d="M0 280 Q250 200 500 240 Q750 180 1000 250 L1000 350 L0 350 Z" fill="#758B79" opacity="0.5" />
  <path d="M0 310 Q350 250 700 280 Q850 260 1000 290 L1000 380 L0 380 Z" fill="#6A8068" opacity="0.7" />

  <!-- Pasture grass field -->
  <rect x="0" y="340" width="1000" height="310" fill="url(#pasture)" />
  
  <!-- Open Barn Structure in background -->
  <path d="M550 210 L850 190 L950 240 L650 260 Z" fill="#3D4B5C" />
  <path d="M650 260 L950 240 L950 360 L650 380 Z" fill="#4B3526" />
  <!-- Stainless bulk milk cooler shed -->
  <rect x="700" y="270" width="80" height="70" fill="#9CB2C6" />
  <rect x="800" y="270" width="60" height="70" fill="#CBD8E2" />

  <!-- Wooden post fence in middle distance -->
  <line x1="0" y1="410" x2="1000" y2="400" stroke="#7D5F42" stroke-width="3" />
  <line x1="0" y1="435" x2="1000" y2="425" stroke="#7D5F42" stroke-width="3" />
  <rect x="80" y="380" width="12" height="75" fill="#5E432A" />
  <rect x="250" y="375" width="12" height="75" fill="#5E432A" />
  <rect x="420" y="370" width="12" height="75" fill="#5E432A" />
  <rect x="600" y="365" width="12" height="75" fill="#5E432A" />
  <rect x="780" y="360" width="12" height="75" fill="#5E432A" />

  <!-- Cattle grazing silhouette on clean pasture -->
  <!-- Cow 1 (Foreground) -->
  <g fill="#2B2118">
    <ellipse cx="320" cy="460" rx="60" ry="32" />
    <circle cx="255" cy="445" r="22" />
    <rect x="275" y="480" width="10" height="50" rx="3" />
    <rect x="300" y="480" width="10" height="48" rx="3" />
    <rect x="340" y="480" width="10" height="52" rx="3" />
    <rect x="365" y="480" width="10" height="50" rx="3" />
    <path d="M380 455 Q395 480 390 515" stroke="#2B2118" stroke-width="4" fill="none" />
  </g>
  <!-- Cow 2 (Further away grazing) -->
  <g fill="#423429">
    <ellipse cx="490" cy="430" rx="42" ry="24" />
    <circle cx="445" cy="425" r="16" />
    <rect x="460" y="445" width="8" height="38" rx="2" />
    <rect x="480" y="445" width="8" height="36" rx="2" />
    <rect x="505" y="445" width="8" height="38" rx="2" />
    <rect x="520" y="445" width="8" height="36" rx="2" />
  </g>

  <!-- Clean caption overlay tag -->
  <rect x="40" y="550" width="360" height="65" rx="4" fill="#1F3A5F" opacity="0.95" />
  <text x="60" y="580" font-family="Georgia, serif" font-size="15" fill="#FBF8F1">Pak Organic Farms Herd</text>
  <text x="60" y="600" font-family="sans-serif" font-size="11" fill="#C9962B">OPEN PADDOCK & ETHICAL CARE • RAWAT/ISLAMABAD</text>
</svg>

